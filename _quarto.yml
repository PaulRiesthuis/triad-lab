project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "research/index.qmd"
    - "publications/index.qmd"
    - "team/index.qmd"
    - "posts/index.qmd"
    - "posts/*/*.qmd"
    - "resources/index.qmd"
    - "contact/index.qmd"
  resources:
    - "images/*"
    - "Triad_MMM.jpg"
    - "resources/talks/*"
    - "posts/**/*.png"
    - "posts/**/*.sav"

website:
  title: "The Triad Lab"
  description: "Memory | Methods | Mind — Research lab led by Dr. Paul Riesthuis at Erasmus University Rotterdam (ESSB) exploring eyewitness memory, statistics & SESOI, and the illusory truth effect."
  site-url: "https://paulriesthuis.github.io/RiesthuisWebsite/"
  favicon: "images/logo.jpg"
  repo-url: "https://github.com/PaulRiesthuis/RiesthuisWebsite"
  repo-actions: [issue]
  
  navbar:
    background: primary
    search: true
    collapse-below: lg
    logo: "images/logo.jpg"
    title: "THE TRIAD LAB"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research/index.qmd
      - text: "Publications"
        href: publications/index.qmd
      - text: "Team"
        href: team/index.qmd
      - text: "R Analyses & Posts"
        href: posts/index.qmd
      - text: "Resources"
        href: resources/index.qmd
      - text: "Contact"
        href: contact/index.qmd
    right:
      - icon: github
        href: https://github.com/PaulRiesthuis
        aria-label: GitHub
      - icon: envelope
        href: mailto:paul.riesthuis@kuleuven.be
        aria-label: Email
        
  page-footer:
    background: primary
    left: "© 2026 The Triad Lab • Erasmus University Rotterdam (ESSB)"
    center: "▲ **Memory | Methods | Mind** ▲"
    right: "Built with [Quarto](https://quarto.org) & [R](https://www.r-project.org)"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [slate, custom.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: false
    code-copy: hover
    smooth-scroll: true
    mainfont: "Plus Jakarta Sans"
    monofont: "JetBrains Mono"
